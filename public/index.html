<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Postcode Distance Checker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>Postcode Distance Checker</h1>
    <p class="subtitle">Verify driver-claimed mileage using Google Maps driving distance.</p>

    <form id="distance-form">
      <label for="origin">From postcode</label>
      <input type="text" id="origin" name="origin" placeholder="e.g. SW1A 1AA" required autocomplete="off">

      <label for="destination">To postcode</label>
      <input type="text" id="destination" name="destination" placeholder="e.g. M1 1AE" required autocomplete="off">

      <label for="claimedMiles">Miles claimed by driver (optional)</label>
      <input type="number" id="claimedMiles" name="claimedMiles" placeholder="e.g. 210" min="0" step="0.1">

      <button type="submit">Check distance</button>
    </form>

    <div id="result" class="result" hidden></div>
    <div id="error" class="error" hidden></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
